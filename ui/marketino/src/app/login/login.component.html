<mat-card class="container" style="background-color: rgba(32,38,52,255); border: 1px solid white; border-radius: 5px;">
  <mat-card-title>
    <img src="assets/icon.png" alt="Example Image">
</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" style="width: 500px">
      <p>
        <mat-form-field class="form-field">
          <input
            type="text"
            matInput
            placeholder="نام کاربری"
            formControlName="username"
          />
        </mat-form-field>
      </p>

      <p>
        <mat-form-field  class="form-field">
          <input
            type="password"
            matInput
            placeholder="رمز عبور"
            formControlName="password"
          />
        </mat-form-field>
      </p>

      <p *ngIf="error" class="error">
        {{ error }}
      </p>

        <button class="btn" (click)="login()">ورود</button>

    </form>
  </mat-card-content>
</mat-card>
