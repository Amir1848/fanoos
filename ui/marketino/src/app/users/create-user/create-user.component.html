<div>
  <h3>تعریف کاربر جدید</h3>
  <hr />
  <div class="form-container">
    <form [formGroup]="form">

        <mat-form-field appearance="outline" style="width: 40%" >
            <mat-label>نام</mat-label>
            <input formControlName="firstName" matInput />
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 40%" >
          <mat-label>نام خانوادگی</mat-label>
          <input formControlName="lastName" matInput />
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 40%" >
          <mat-label>نام کاربری</mat-label>
          <input formControlName="userName" matInput />
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 40%" >
          <mat-label>رمز عبور</mat-label>
          <input formControlName="password" type="password" matInput />
        </mat-form-field>

        <mat-checkbox formControlName="isAdmin" style="width: 40%" >کاربر ارشد</mat-checkbox>     
        
        <button mat-raised-button color="primary" (click)="save()">Primary</button>
    </form>
  </div>
</div>
