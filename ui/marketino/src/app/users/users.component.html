<div class="user-header">
  <h2 class="form-header">کاربران</h2>
  <p class="form-detail">لیست کاربران بشرح زیر میباشد</p>
  <div class="import-export-panel">
    <button mat-button>
      <i class="fa fa-cloud-download" aria-hidden="true"></i>
      دانلود
    </button>
    <button  mat-button>
      <i class="fa fa-cloud-upload" aria-hidden="true"></i>
      آپلود
    </button>
  </div>
  <div class="add-new">
    <button mat-fab extended color="primary" (click)="change()">
      <mat-icon>add</mat-icon>
      افزودن کاربر
    </button>
  </div>
</div>

<ag-grid-angular
  class="ag-theme-quartz"
  style="height: 500px;"
  [rowData]="rowData"
  [columnDefs]="colDefs"
  [enableRtl]="true"
/>
