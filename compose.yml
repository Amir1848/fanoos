services:
  postgres:
    image: docker.arvancloud.ir/postgres:16
    container_name: fanoos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fanoos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mosquitto:
    image: docker.arvancloud.ir/eclipse-mosquitto:2
    container_name: fanoos-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  whisper:
    image: ghcr.nju.edu.cn/ggml-org/whisper.cpp:main
    container_name: fanoos-whisper
    restart: unless-stopped
    command:
      - -c
      - |
        exec whisper-server --host 0.0.0.0 --port 8080 -m /models/ggml-large-v3.bin -l fa -t 4
    ports:
      - "127.0.0.1:8176:8080"
    volumes:
      - ./ggml-large-v3.bin:/models/ggml-large-v3.bin:ro
    mem_limit: 8g

  pgadmin:
    image: mirror-docker.runflare.com/dpage/pgadmin4:latest
    container_name: fanoos-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fanoos.ir
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  mosquitto-data:
  mosquitto-log:
  postgres-data:
  pgadmin-data:
