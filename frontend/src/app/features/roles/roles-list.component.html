<div class="page-header">
  <h2 class="page-title">
    نقش‌ها
    <span class="page-subtitle">مدیریت نقش‌های کاربری سامانه</span>
  </h2>
  <div class="page-actions">
    <button type="button" class="btn btn-ghost" (click)="load()" [disabled]="loading()" title="بازخوانی">
      <app-icon name="refresh" [size]="17" />
    </button>
    <button
      type="button"
      class="btn btn-danger"
      (click)="deleteSelected()"
      [disabled]="selectedIds().length === 0 || deleting()"
    >
      <app-icon name="trash" [size]="16" />
      حذف
      @if (selectedIds().length > 0) {
        ({{ selectedIds().length }})
      }
    </button>
    <button type="button" class="btn btn-primary" (click)="newRole()">
      <app-icon name="plus" [size]="16" />
      نقش جدید
    </button>
  </div>
</div>

<app-data-table
  [columns]="columns"
  [rows]="rows()"
  [loading]="loading()"
  [page]="page()"
  [pageSize]="pageSize()"
  [hasNext]="hasNext()"
  rowActionIcon="lock"
  rowActionTitle="دسترسی‌ها"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (rowOpen)="openRow($event)"
  (rowAction)="manageAccess($event)"
  (selectionChange)="selectedIds.set($event)"
/>
